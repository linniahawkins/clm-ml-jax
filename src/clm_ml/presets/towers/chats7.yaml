# The CHATS7 tower (preset for `clm-ml new`): the CHATS walnut orchard, Dixon, California
# (Bonan, Burns & Patton 2026). Generated in Phase 1 from the legacy TowerDataMod.py
# (deleted in Phase 7.4); the forcing interval (30 min) is a run.yaml setting. The texture is
# given as percentages (10 % sand, 35 % clay: a silty clay loam), as the Fortran run uses them.

CHATS7:
  latitude: 38.49
  longitude: -121.84
  measurement_height: 23.0
  soil:
    texture: {given_as: percentages, sand_percent: 10.0, clay_percent: 35.0}
    organic_matter: 50.0
    color_class: 15
    bedrock_depth: 2.0
  patches:
  - pft: broadleaf_deciduous_temperate_tree
    weight: 1.0
    canopy_height: 10.0
    root_biomass: 500.0
    area_profiles: {leaf_beta: [2.6, 1.3], stem_beta: [1.8, 1.3]}
