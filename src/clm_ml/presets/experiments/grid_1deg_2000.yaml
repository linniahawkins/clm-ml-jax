# Preset for `clm-ml new DIR --from grid_1deg_2000`: the settings that differ from the
# defaults. `new` writes the four complete files. The inputs are on NCAR's Derecho/Campaign
# storage (docs/design/global_input.md).
description: >-
  A 1 degree (f09) grid run of 2000 over the whole globe (14 346 gridcells, 72 575 patches;
  needs a GPU, execution.devices: 4 on a 4-GPU node): CRUJRA v4.10 forcing, CLM6
  parameters, soil moisture prescribed from a CTSM 5.4 run. A box in domain.yaml grid.region
  (e.g. {lat: [30, 50], lon: [-110, -80]}) runs a region, small ones on a CPU.
run:
  time: {start: 2000-01-01T00:00, length: until 2001-01-01T00:00}
  forcing:
    gridded:
      meteorology:
        years: {taxmode: cycle, year_first: 1901, year_last: 2025}   # the CRUJRA files on disk
        tpqw: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/clmforc.CRUJRAv4.10_0.5x0.5.TPQWL.{year}.nc
        solar: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/clmforc.CRUJRAv4.10_0.5x0.5.Solr_Diffuse.{year}.nc
        precipitation: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/clmforc.CRUJRAv4.10_0.5x0.5.Prec.{year}.nc
        mask: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/domain.crujra.v2.5_0.5x0.5.c240722.nc
      co2: {source: file, file: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/CO2field/fco2_datm_global_simyr_1700-2025_TRENDY_c260722.nc}
      soil:
        years: {taxmode: cycle, year_first: 1850, year_last: 2023}   # the CTSM 5.4 run's history
        files: "/glade/derecho/scratch/slevis/archive/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist/lnd/hist/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist.clm2.h0a.{year}-{month:02d}.nc"
  output:
    directory: output
    streams:
    - name: daily
      frequency: daily
      variables: [latent_heat_flux, sensible_heat_flux, net_radiation, gpp, ground_heat_flux,
                  canopy_top_air_temperature, leaf_area_index, soil_water_stress]
      level: [patch, gridcell]
      file_per: month
domain:
  type: grid
  grid:
    surface_data: /glade/campaign/cesm/cesmdata/inputdata/lnd/clm2/surfdata_esmf/ctsm5.4.0/surfdata_0.9x1.25_hist_2000_16pfts_c251022.nc
    land_mask: /glade/derecho/scratch/slevis/archive/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist/lnd/hist/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist.clm2.h0a.2000-01.nc
model:
  canopy_layers: {layer_counts: {within: 10, above: 10}, max_layers: 20}
  numerics: {on_patch_error: exclude, max_failed_patch_fraction: 0.05}
params: clm6
