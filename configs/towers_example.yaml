# Tower descriptions. The built-in registry (clm_ml/data/towers.yaml, moved from
# TowerDataMod.py) uses this format, and users can pass their own via domain.towers_file.
#
# Each tower defines one gridcell (location + forcing height), its soil, and one or more
# patches (one PFT each, with an area weight). Weights on a tower must sum to 1.
# With model.yaml soil.columns: per_patch (default), every patch gets its own soil column
# with the tower's soil properties.
# null means "use the default" (was the -999 sentinel).

CHATS7:
  latitude: 38.49                  # degrees north
  longitude: -121.84               # degrees east
  measurement_height: 23.0         # forcing (reference) height, m
  forcing_step_minutes: 30
  soil:
    texture_class: silty clay loam # used only when sand/clay are null
    sand_percent: 10.0
    clay_percent: 35.0
    organic_matter: 50.0           # kg m-3
    color_class: 15
    bedrock_depth: 2.0             # m
  patches:
    - pft: broadleaf_deciduous_temperate_tree   # walnut orchard
      weight: 1.0
      canopy_height: 10.0          # m
      root_biomass: 500.0          # g m-2
      leaf_area_profile_beta: [2.6, 1.3]
      stem_area_profile_beta: [1.8, 1.3]

# Hypothetical mixed-vegetation tower, to show the multi-patch format (not real data).
EXAMPLE-MIXED:
  latitude: 45.0
  longitude: -85.0
  measurement_height: 30.0
  forcing_step_minutes: 30
  soil: {texture_class: sand, sand_percent: null, clay_percent: null,
         organic_matter: 20.0, color_class: 10, bedrock_depth: 3.0}
  patches:
    - pft: broadleaf_deciduous_temperate_tree
      weight: 0.7
      canopy_height: 21.0
      root_biomass: null           # null: PFT default
      leaf_area_profile_beta: null # null: PFT default profile
      stem_area_profile_beta: null
    - pft: c3_non-arctic_grass
      weight: 0.3
      canopy_height: 0.5
      root_biomass: null
      leaf_area_profile_beta: null
      stem_area_profile_beta: null
      # A 0.5 m grass under a 30 m tower needs 300 layers at the default spacing; explicit
      # counts instead (Bonan et al. 2021: 5-10 layers within the canopy are enough)
      n_layers_within: 5
      n_layers_above: 10
