# domain.yaml: where the experiment runs: towers (location, forcing height, soil, patches) or a
# grid (a CLM surface dataset). Part of an experiment folder (run.yaml, domain.yaml, model.yaml,
# params.yaml). Every setting is listed; REQUIRED keys have no default. Generated by clm-ml
# 0.1.0 (`clm-ml new chats7_1day --from chats7_1day`).

# towers: the towers listed below; grid: the gridcells of a CLM surface dataset.
# choices: towers | grid; REQUIRED.
type: towers

# The towers, by name (each one gridcell with its own forcing).
towers:
  CHATS7:
    # Latitude, degrees north.
    # REQUIRED.
    latitude: 38.49

    # Longitude, degrees east.
    # REQUIRED.
    longitude: -121.84

    # The patches on the tower's gridcell.
    patches:
    # Plant functional type (a name from params.yaml, e.g. broadleaf_deciduous_temperate_tree).
    # REQUIRED.
    - pft: broadleaf_deciduous_temperate_tree

      # Fraction of the gridcell; the weights of a tower sum to 1.
      # default: 1.0.
      weight: 1.0

      # Canopy height (m); null: from the CLM history file.
      # default: null.
      canopy_height: 10.0

      # Root biomass (g m-2); null: the PFT default.
      # default: null.
      root_biomass: 500.0

      # Beta distribution (p, q) of leaf area with height; null: the PFT default.
      # default: null.
      leaf_area_profile_beta: [2.6, 1.3]

      # Beta distribution (p, q) of stem area with height; null: the PFT default.
      # default: null.
      stem_area_profile_beta: [1.8, 1.3]

      # Canopy-air layers within the canopy for this patch; null: model.yaml canopy_layers. Set
      # with n_layers_above (e.g. a short canopy under a tall tower; 5-10 layers within the canopy
      # suffice for fluxes, Bonan et al. 2021).
      # default: null.
      n_layers_within: null

      # Canopy-air layers above the canopy for this patch; null: model.yaml.
      # default: null.
      n_layers_above: null

    # Forcing (reference) height (m); null: 30 m.
    # Fortran: tower_ht; default: null.
    measurement_height: 23.0

    # The soil.
    soil:
      # USDA texture class (e.g. silty clay loam), used when sand and clay are null.
      # default: null.
      texture_class: silty clay loam

      # Sand content (%).
      # default: null.
      sand_percent: 10.0

      # Clay content (%).
      # default: null.
      clay_percent: 35.0

      # Soil organic matter density (kg m-3).
      # default: null.
      organic_matter: 50.0

      # CLM soil colour class, 1 (light) to 20 (dark): soil albedo.
      # default: 15.
      color_class: 15

      # Depth to bedrock (m); null: none.
      # default: null.
      bedrock_depth: 2.0

# Patches covering less than this fraction of their gridcell are left out (the others' weights
# renormalized to sum to 1).
# default: 0.0.
min_patch_weight: 0.0
