# run.yaml: when the experiment runs, with which forcing and land data, and what it writes. Part
# of an experiment folder (run.yaml, domain.yaml, model.yaml, params.yaml). Every setting is
# listed; REQUIRED keys have no default. Paths are relative to this folder. Generated by clm-ml
# 0.1.0 (`clm-ml new grid_1deg_2000 --from grid_1deg_2000`).

time:
  # The simulated period and calendar (the model time step is model.yaml numerics.step_seconds).

  # First model time, ISO date-time (e.g. 2007-05-01T00:00).
  # Fortran: start_ymd, start_tod; REQUIRED.
  start: 2000-01-01T00:00

  # How long the run lasts: a number of days (e.g. 1 day, 31 days), of model steps (e.g. 48
  # steps), or until a date-time (e.g. until 2001-01-01T00:00).
  # Fortran: stop_option, stop_n; REQUIRED.
  length: until 2001-01-01T00:00

  # Model calendar, as CTSM's GREGORIAN / NO_LEAP: dates, solar geometry, run length and output
  # records follow it. noleap only for grid runs (tower forcing is a real time series).
  # choices: gregorian | noleap; default: gregorian.
  calendar: gregorian

forcing:
  # Meteorology and prescribed land data.

  # Gridded forcing: CRUJRA datm streams, CO2, monthly CLM soil history (vegetation comes from the
  # surface data).
  gridded:
    # The meteorology streams.
    meteorology:
      # Temperature, pressure, humidity, wind and longwave stream.
      # REQUIRED.
      tpqw: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/clmforc.CRUJRAv4.10_0.5x0.5.TPQWL.{year}.nc

      # Solar radiation stream.
      # REQUIRED.
      solar: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/clmforc.CRUJRAv4.10_0.5x0.5.Solr_Diffuse.{year}.nc

      # Precipitation stream.
      # REQUIRED.
      precipitation: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/clmforc.CRUJRAv4.10_0.5x0.5.Prec.{year}.nc

      # The streams' 0.5 degree domain file with mask.
      # REQUIRED.
      mask: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/three_stream/domain.crujra.v2.5_0.5x0.5.c240722.nc

    # Atmospheric CO2.
    co2:
      # A CO2 time series file, or a constant value.
      # choices: file | constant; default: file.
      source: file

      # CO2 time series file (CO2, time with units and calendar).
      # used with source: file; REQUIRED.
      file: /glade/campaign/cgd/tss/projects/TRENDY2026/inputs/CO2field/fco2_datm_global_simyr_1700-2025_TRENDY_c260722.nc

    # Monthly soil water and temperature.
    soil:
      # The files, with {year} and {month} expanded.
      # REQUIRED.
      files: /glade/derecho/scratch/slevis/archive/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist/lnd/hist/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist.clm2.h0a.{year}-{month:02d}.nc

    # Forcing within a model step's sub-steps, as for towers: three-point interpolation (CLM-ml
    # v2) or the step's value.
    # choices: none | three_point; Fortran: met_type 3/0; default: three_point.
    interpolation: three_point

initial_conditions:
  # The state before the first step.

  # clm_history: canopy air and leaves from the first forcing record, soil temperature from the
  # CLM history (towers) or the monthly soil history (grid); restart: a restart file of an earlier
  # run.
  # choices: clm_history | restart; default: clm_history.
  source: clm_history

output:
  # What the run writes.

  # Output directory.
  # default: output.
  directory: output

  # The output streams.
  streams:
  # Name of the stream (in its file names).
  # REQUIRED.
  - name: daily

    # How often a record is written.
    # choices: step | hourly | daily | monthly | yearly; default: step.
    frequency: daily

    # What a record holds for its interval.
    # choices: mean | instantaneous | min | max; default: mean.
    statistic: mean

    # Variables: all, or names from clm_ml.outputs.VARIABLES (e.g. latent_heat_flux, gpp).
    # default: [all].
    variables: [latent_heat_flux, sensible_heat_flux, net_radiation, gpp, ground_heat_flux, canopy_top_air_temperature, leaf_area_index, soil_water_stress]

    # Patch values, area-weighted gridcell sums, or both.
    # default: [patch, gridcell].
    level: [patch, gridcell]

    # One file per run, year or month.
    # choices: run | year | month; default: run.
    file_per: month

execution:
  # How the run is divided into compiled chunks, where it runs and how often it saves restarts.
  # None of this changes the results.

  # Compiled chunk length: 'N days' (one compiled program; a short last chunk is padded) or '1
  # month' (calendar months). Sets how much forcing is in memory and how often the checks run.
  # default: 10 days.
  chunk: 10 days

  # When restart files are written: end_of_run, or every 'N months' or 'N years' (and at the end).
  # default: end_of_run.
  restart_every: end_of_run

  # Number of devices (e.g. 4 GPUs on a Derecho node) the patches are spread over.
  # default: 1.
  devices: 1
