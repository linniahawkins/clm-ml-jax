# domain.yaml: where the experiment runs: towers (location, forcing height, soil, patches) or a
# grid (a CLM surface dataset). Part of an experiment folder (run.yaml, domain.yaml, model.yaml,
# params.yaml). Every setting is listed; REQUIRED keys have no default. Generated by clm-ml
# 0.1.0 (`clm-ml new grid_1deg_2000 --from grid_1deg_2000`).

# towers: the towers listed below; grid: the gridcells of a CLM surface dataset.
# choices: towers | grid; REQUIRED.
type: grid

# The grid.
grid:
  # CLM surface dataset (natural PFTs, their weights, canopy heights, monthly LAI and SAI, soil
  # texture and colour).
  # REQUIRED.
  surface_data: /glade/campaign/cesm/cesmdata/inputdata/lnd/clm2/surfdata_esmf/ctsm5.4.0/surfdata_0.9x1.25_hist_2000_16pfts_c251022.nc

  # A CLM history file with landmask on the surface-data grid.
  # REQUIRED.
  land_mask: /glade/derecho/scratch/slevis/archive/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist/lnd/hist/wetlands.n04.ctsm5.4.044_f09BgcCrop_flat_174_Hist.clm2.h0a.2000-01.nc

  # Only the gridcells in this box; null: the whole globe.
  region:
    # Latitudes [south, north], degrees north.
    # default: [-90.0, 90.0].
    lat: [30.0, 50.0]

    # Longitudes [west, east], degrees east (may wrap).
    # default: [-180.0, 360.0].
    lon: [-110.0, -80.0]

  # Root biomass of every patch (g m-2).
  # default: 500.0.
  root_biomass: 500.0

  # Forcing height above the zero-plane displacement plus z0m (m; CLM's Sa_z).
  # default: 30.0.
  forcing_height: 30.0

# Patches covering less than this fraction of their gridcell are left out (the others' weights
# renormalized to sum to 1).
# default: 0.0.
min_patch_weight: 0.0
