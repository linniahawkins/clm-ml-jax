# params.yaml: which plants: every parameter of every PFT 1-16 (the numbers gradients come back
# for). Part of an experiment folder (run.yaml, domain.yaml, model.yaml, params.yaml). Each
# patch uses the row of its PFT.
# Copied from the compset clm6.
# Generated by clm-ml 0.1.0 (`clm-ml new grid_1deg_2000 --from grid_1deg_2000`).

# Units and meaning of each parameter (spectral ones are [visible, near-infrared]).
units:
  # Maximum carboxylation rate at 25 C, canopy top
  vcmax25: umol m-2 s-1
  # Marginal water-use efficiency (WUE stomatal model)
  iota: umol CO2 mol-1 H2O
  # Minimum stomatal conductance
  gs_min: mol H2O m-2 s-1
  # Ball-Berry minimum leaf conductance
  g0_ball_berry: mol H2O m-2 s-1
  # Ball-Berry slope
  g1_ball_berry: '-'
  # Medlyn minimum leaf conductance
  g0_medlyn: mol H2O m-2 s-1
  # Medlyn slope
  g1_medlyn: kPa0.5
  # Leaf water potential at 50% loss of stomatal conductance
  psi50_gs: MPa
  # Shape parameter for stomatal closure with leaf water potential
  shape_gs: '-'
  # 1 for C3 photosynthesis, 0 for C4 (structural)
  c3_photosynthesis: '1'
  # Stem hydraulic conductance per unit leaf area
  plant_conductance: mmol H2O m-2 s-1 MPa-1
  # Plant capacitance per unit leaf area
  plant_capacitance: mmol H2O m-2 MPa-1
  # Fine root radius
  root_radius: m
  # Fine root density (biomass per root volume)
  root_density: g m-3
  # Hydraulic resistivity of root tissue
  root_resistivity: MPa s g mmol-1 H2O
  # Root profile shape parameter
  root_profile_beta: '-'
  # Leaf dimension (for boundary-layer conductance)
  leaf_dimension: m
  # Leaf angle departure from spherical (chi_l)
  leaf_angle_index: '-'
  # Specific leaf area at canopy top
  sla_top: m2 gC-1
  # Leaf emissivity
  leaf_emissivity: '-'
  # Foliage clumping index
  clumping_index: '-'
  # Leaf reflectance [vis, nir]
  leaf_reflectance: '-'
  # Leaf transmittance [vis, nir]
  leaf_transmittance: '-'
  # Stem reflectance [vis, nir]
  stem_reflectance: '-'
  # Stem transmittance [vis, nir]
  stem_transmittance: '-'
  # Momentum roughness length / canopy height (CLM z0mr) Optional: only grid runs use it.
  z0m_to_height_ratio: '-'
  # Displacement height / canopy height (CLM displar) Optional: only grid runs use it.
  displacement_to_height_ratio: '-'
