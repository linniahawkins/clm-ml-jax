# params.yaml: which plants: every parameter of every PFT 1-16 (the numbers gradients come back
# for). Part of an experiment folder (run.yaml, domain.yaml, model.yaml, params.yaml). Each
# patch uses the row of its PFT.
# Copied from the compset clm6.
# Generated by clm-ml 0.1.0 (`clm-ml new grid_1deg_2000 --from grid_1deg_2000`).

# Units and meaning of each parameter (spectral ones are [visible, near-infrared]).
units:
  # Maximum carboxylation rate at 25 C, canopy top
  vcmax25: umol m-2 s-1
  # Marginal water-use efficiency (WUE stomatal model)
  iota: umol CO2 mol-1 H2O
  # Minimum stomatal conductance
  gs_min: mol H2O m-2 s-1
  # Ball-Berry minimum leaf conductance
  g0_ball_berry: mol H2O m-2 s-1
  # Ball-Berry slope
  g1_ball_berry: '-'
  # Medlyn minimum leaf conductance
  g0_medlyn: mol H2O m-2 s-1
  # Medlyn slope
  g1_medlyn: kPa0.5
  # Leaf water potential at 50% loss of stomatal conductance
  psi50_gs: MPa
  # Shape parameter for stomatal closure with leaf water potential
  shape_gs: '-'
  # 1 for C3 photosynthesis, 0 for C4 (structural)
  c3_photosynthesis: '1'
  # Stem hydraulic conductance per unit leaf area
  plant_conductance: mmol H2O m-2 s-1 MPa-1
  # Plant capacitance per unit leaf area
  plant_capacitance: mmol H2O m-2 MPa-1
  # Fine root radius
  root_radius: m
  # Fine root density (biomass per root volume)
  root_density: g m-3
  # Hydraulic resistivity of root tissue
  root_resistivity: MPa s g mmol-1 H2O
  # Root profile shape parameter
  root_profile_beta: '-'
  # Fine root carbon per leaf carbon (CLM froot_leaf)
  root_to_leaf_ratio: gC gC-1
  # Largest root conductance per root area, mm H2O s-1 per mm of water potential, times the path length in m (CLM krmax)
  root_conductance_max: m s-1
  # Water potential at 50% loss of root conductance (CLM psi50, root segment)
  root_psi50: MPa
  # Shape of the root's vulnerability curve (CLM ck, root segment)
  root_ck: '-'
  # Leaf dimension (for boundary-layer conductance)
  leaf_dimension: m
  # Leaf angle departure from spherical (chi_l)
  leaf_angle_index: '-'
  # Specific leaf area at canopy top
  sla_top: m2 gC-1
  # Leaf emissivity
  leaf_emissivity: '-'
  # Foliage clumping index
  clumping_index: '-'
  # Leaf reflectance [vis, nir]
  leaf_reflectance: '-'
  # Leaf transmittance [vis, nir]
  leaf_transmittance: '-'
  # Stem reflectance [vis, nir]
  stem_reflectance: '-'
  # Stem transmittance [vis, nir]
  stem_transmittance: '-'
  # Largest stability (reference height - displacement height) / Obukhov length in stable conditions (CLM zetamaxstable); 1e30: no limit, as CLM-ml v2
  zeta_max_stable: '-'
  # Momentum roughness length / canopy height (CLM z0mr) Optional: only grid runs use it.
  z0m_to_height_ratio: '-'
  # Displacement height / canopy height (CLM displar) Optional: only grid runs use it.
  displacement_to_height_ratio: '-'
# Soil hydrology (CLM's parameters; the same for every PFT). Used by runs with
# predicted soil water (model.yaml soil.water: predicted).
hydrology:
  # Ice impedance: the hydraulic conductivity is reduced by 10^(-e_ice x ice-filled fraction of the pores) (-).
  e_ice: 6.0
  # Decay of the saturated fraction of the surface with the water table depth (m-1).
  fff: 0.5
  # Fraction of the ground under ponded water above which the ponds connect and run off (-).
  pc: 0.4
  # Exponent of the connected ponded fraction in the pond's runoff (-).
  mu: 0.13889
  # Drainage rate per metre of saturated zone above the bedrock, on a 45 degree slope (mm s-1 m-1; a CLM namelist value).
  baseflow_scalar: 0.001
  # Exponent of the saturated zone's thickness in the drainage (-).
  n_baseflow: 1.0
  # Smallest specific yield of a soil level (-).
  aq_sp_yield_min: 0.02
  # Exponent of the microtopography's dependence on the slope (-).
  slopebeta: -3.0
  # Slope scale of the microtopography (degrees).
  slopemax: 0.4
