# domain.yaml: where the experiment runs: towers (location, forcing height, soil, patches) or a
# grid (a CLM surface dataset). Part of an experiment folder (run.yaml, domain.yaml, model.yaml,
# params.yaml). Every setting is listed; REQUIRED keys have no default. Generated by clm-ml
# 0.1.0 (`clm-ml new chats7_may2007_fortran --from chats7_may2007_fortran`).

# towers: the towers listed below; grid: the gridcells of a CLM surface dataset.
# choices: towers | grid; REQUIRED.
type: towers

# The towers, by name (each one gridcell with its own forcing).
towers:
  CHATS7:
    # Latitude, degrees north.
    # REQUIRED.
    latitude: 38.49

    # Longitude, degrees east.
    # REQUIRED.
    longitude: -121.84

    # Forcing (reference) height (m).
    # Fortran: tower_ht; default: 30.0.
    measurement_height: 23.0

    # The soil.
    soil:
      # The soil texture.
      texture:
        # How the texture is given: percentages or class.
        # choices: percentages | class; default: percentages.
        given_as: percentages

        # Sand content (%).
        # used with given_as: percentages; REQUIRED.
        sand_percent: 10.0

        # Clay content (%).
        # used with given_as: percentages; REQUIRED.
        clay_percent: 35.0

      # Soil organic matter density (kg m-3), in the top 0.5 m.
      # REQUIRED.
      organic_matter: 50.0

      # CLM soil colour class, 1 (light) to 20 (dark): soil albedo.
      # default: 15.
      color_class: 15

      # Depth to bedrock (m); null: no bedrock.
      # default: null.
      bedrock_depth: 2.0

    # The patches on the tower's gridcell.
    patches:
    # Plant functional type (a name from params.yaml, e.g. broadleaf_deciduous_temperate_tree).
    # REQUIRED.
    - pft: broadleaf_deciduous_temperate_tree

      # Fraction of the gridcell; the weights of a tower sum to 1.
      # default: 1.0.
      weight: 1.0

      # Canopy height (m), or pft_default (CLM's height of the PFT: 17 m needleleaf, 35/18/20 m
      # broadleaf trees, 0.5 m shrubs and grasses).
      # Fortran: tower_canht; htop_pft; default: pft_default.
      canopy_height: 10.0

      # Fine root biomass (g m-2).
      # Fortran: tower_root; REQUIRED.
      root_biomass: 500.0

      # Leaf and stem area profiles: pft_default, or {leaf_beta: [p, q], stem_beta: [p, q]} (both,
      # as Fortran).
      area_profiles:
        # Leaf area (p, q).
        # REQUIRED.
        leaf_beta: [2.6, 1.3]

        # Stem area (p, q).
        # REQUIRED.
        stem_beta: [1.8, 1.3]

      # This patch's canopy-air layer counts: from_model_yaml (model.yaml canopy_layers), or
      # {within: N, above: M}, which take precedence over model.yaml (e.g. a short canopy under a
      # tall tower).
      # default: from_model_yaml.
      canopy_layers: from_model_yaml

# Patches covering less than this fraction of their gridcell are left out (the others' weights
# renormalized to sum to 1).
# default: 0.0.
min_patch_weight: 0.0
