# model.yaml: how each process is represented (parameterizations) and the numerics. Part of an
# experiment folder (run.yaml, domain.yaml, model.yaml, params.yaml). Every setting is listed;
# the defaults are CLM-ml v2 as run for CHATS (Bonan et al. 2026), the configuration validated
# against Fortran. Changing anything here recompiles the model; none of these settings is
# differentiable (calibrated numbers belong in params.yaml). Differs from the defaults in:
# processes.photosynthesis.temperature_acclimation. Generated by clm-ml 0.1.0 (`clm-ml new
# chats7_may2007_fortran --from chats7_may2007_fortran`).

processes:
  # How each process is represented: the parameterizations (schemes) and their options. The
  # defaults are CLM-ml v2 as run for CHATS (Bonan et al. 2026), validated against Fortran.

  photosynthesis:
    # Leaf photosynthesis (Farquhar) and the leaf nitrogen profile through the canopy.

    # Co-limitation (smoothed minimum) of the Rubisco, light and product limited rates; false
    # takes the plain minimum.
    # Fortran: colim_type 1/0; default: true.
    colimitation: true

    # Acclimation of the photosynthetic temperature responses (Kattge and Knorr 2007) to a running
    # mean of air temperature carried in the state (as CLM), to the mean over the whole run
    # (Fortran CLM-ml v2; needs all forcing before the run starts: validation only), or none.
    # choices: running_mean | run_mean | none; Fortran: acclim_type 1/0; run_mean = init_acclim
    # (CLMml_driver); default: running_mean.
    temperature_acclimation: run_mean

    # Decay coefficient of leaf nitrogen (Vcmax25) through the canopy: computed from Vcmax25 at
    # the canopy top, exp(0.00963 Vcmax25 - 2.43) (Bonan et al. 2021), or a number.
    # Fortran: kn_val (-999 = computed); default: computed.
    nitrogen_profile: computed

  stomatal_conductance:
    # Stomatal conductance.

    # Water-use-efficiency optimization (iota) with the plant hydraulics constraint (CLM-ml v2),
    # or the Medlyn or Ball-Berry relation (their g0, g1 in params.yaml).
    # choices: wue | medlyn | ball_berry; Fortran: gs_type 2/0/1; default: wue.
    scheme: wue

    # Reduce stomatal conductance as leaf water potential falls, gs = max(gs / (1 +
    # (psi_leaf/psi50_gs)^shape_gs), gs_min) (Bonan et al. 2021, supplement eq. 14).
    # Fortran: gspot_type 1/0; default: true.
    water_stress: true

    # Root finder of the WUE optimization: bisection (CLM-ml v2). brent is refused (not translated
    # as traceable code; decisions.md).
    # choices: bisection | brent; used with scheme: wue; Fortran: gs_solver 2/1; default:
    # bisection.
    wue_solver: bisection

  radiation:
    # Radiative transfer through the canopy.

    # Shortwave radiation: two-stream, integrated over each layer. norman is refused (not yet
    # supported).
    # choices: two_stream | norman; Fortran: light_type 2/1; default: two_stream.
    solar: two_stream

    # Longwave radiation: Norman (the only one).
    # choices: norman; Fortran: longwave_type 1; default: norman.
    longwave: norman

    # Leaf optical properties varying with height in the canopy (not supported).
    # Fortran: leaf_optics_type 0/1; default: false.
    leaf_optics_vary_with_height: false

  turbulence:
    # Turbulence and aerodynamic conductances above and within the canopy, and the leaf boundary
    # layer.

    # Harman and Finnigan roughness sublayer with the psihat tables (the only one).
    # choices: harman_finnigan; Fortran: turb_type 1; default: harman_finnigan.
    roughness_sublayer: harman_finnigan

    # Harman-Finnigan adjustments for sparse canopies: the displacement height and the canopy-top
    # Prandtl number depend on the plant area index.
    # Fortran: sparse_canopy_type 1/0; default: true.
    sparse_canopy: true

    # Aerodynamic conductance of the lowest canopy layer to the ground: a log wind profile (CLM-ml
    # v2), or the Harman-Finnigan exponential profile extended down to the ground.
    # choices: log_profile | extend_hf; Fortran: HF_extension_type 2/1; default: log_profile.
    ground_conductance: log_profile

    # Leaf boundary-layer conductance: forced plus free convection (CLM-ml v2), or laminar or
    # turbulent forced convection only.
    # choices: free_convection | laminar | turbulent; Fortran: gb_type 3/1/2; default:
    # free_convection.
    leaf_boundary_layer: free_convection

  canopy_air:
    # Air temperature and vapour in the canopy layers.

    # Coupled implicit solution of air temperature, vapour and leaf temperature in every layer.
    # well_mixed is refused (Fortran calls it legacy, not supported).
    # choices: implicit | well_mixed; Fortran: flux_profile_type 1/0; default: implicit.
    flux_profile_solution: implicit

numerics:
  # Time stepping, solvers and run control.

  # Model time step (s). It must divide the tower forcing interval (run.yaml
  # forcing.meteorology.interval_seconds); a shorter step interpolates the forcing.
  # default: 1800.
  step_seconds: 1800

  # Canopy sub-step (s): each step is split into sub-steps, forcing interpolated within the step,
  # output averaged over them.
  # Fortran: dtime_ml; default: 300.0.
  substep_seconds: 300.0

  # Time integration of the sub-step state (air temperature, vapour, leaf temperature, leaf water
  # potential, intercepted water, ground temperature): 4th-order Runge-Kutta in CLM-ml v2 (v1 used
  # Euler).
  # choices: euler | rk2_trapezoid | rk2_midpoint | rk2_ralston | rk3_heun | rk3_ralston |
  # rk3_kutta | rk4; Fortran: runge_kutta_type; default: rk4.
  integrator: rk4

  # Recompute each step when taking gradients instead of storing its intermediate values
  # (jax.checkpoint, as jax-gcm): much less memory for gradients over a chunk, some more compute.
  # Results are the same either way.
  # default: true.
  checkpoint_steps: true

  # A patch that fails a conservation check or whose state becomes unhealthy: stop the run naming
  # it (as Fortran), or exclude it from then on (global runs; its output is fill values and
  # gridcell sums use the remaining weights).
  # choices: stop | exclude; default: stop.
  on_patch_error: stop

  # With exclude: stop the run when more than this fraction of patches has failed.
  # default: 0.01.
  max_failed_patch_fraction: 0.01

  # Conservation checks that neither stop the run nor exclude a patch (their largest error is
  # still reported), by (part of) their name in clm_ml.checks.BALANCE_CHECKS, e.g.
  # 'CanopyFluxesDiagnostics 3'. Normally empty: every check passes for CHATS7 and the 1-degree
  # grid runs.
  # default: [].
  ignore_checks: []

canopy_layers:
  # The vertical layers of the canopy air space, from the ground to the forcing height. A patch's
  # own layer counts (domain.yaml patches[].canopy_layers) take precedence over these.

  # Layer slots of every patch (one compiled program for all patches; unused slots are masked).
  # CHATS7 uses 46.
  # Fortran: nlevmlcan; default: 50.
  max_layers: 50

  # Numbers of layers within and above the canopy: from_spacing (layers of dz_tall or dz_short
  # thickness), or explicit counts {within: N, above: M} (5-10 within the canopy suffice for
  # fluxes, Bonan et al. 2021).
  # Fortran: nlayer_within, nlayer_above (0 = from spacing); default: from_spacing.
  layer_counts: from_spacing

  # Layer thickness (m) for canopies taller than tall_canopy_threshold.
  # used with layer_counts: from_spacing; Fortran: dz_tall; default: 0.5.
  dz_tall: 0.5

  # Layer thickness (m) for shorter canopies.
  # used with layer_counts: from_spacing; Fortran: dz_short; default: 0.1.
  dz_short: 0.1

  # Canopy height (m) above which dz_tall is used.
  # used with layer_counts: from_spacing; Fortran: dz_param; default: 2.0.
  tall_canopy_threshold: 2.0

  # At setup: layers holding less than this fraction of the canopy's plant area are emptied and
  # their area given to the other layers.
  # Fortran: dpai_min; default: 0.01.
  merge_thin_layers_below: 0.01

  # At every step: every leafy layer keeps at least this plant area (m2 m-2), the missing part
  # added as stem area: thinner layers transmit more diffuse radiation than they receive
  # (decisions.md; CLM-ml v1's dpai_min). 0 reproduces CLM-ml v2.
  # default: 0.01.
  minimum_leafy_layer_plant_area: 0.01

soil:
  # The soil under the patches (the CLM soil layer structure: 20 hydrologically active levels, 25
  # in all).

  # per_patch: each patch has its own soil column (option A). shared: patches on a gridcell share
  # one column (option B; not yet implemented).
  # choices: per_patch | shared; default: per_patch.
  columns: per_patch
