# run.yaml: when the experiment runs, with which forcing and land data, and what it writes.
# Part of an experiment folder (run.yaml, domain.yaml, model.yaml, params.yaml). Every setting
# is listed; REQUIRED keys have no default. Paths are relative to this folder. Generated by clm-
# ml 0.1.0 (`clm-ml new chats7_may2007_fortran --from chats7_may2007_fortran`).

time:
  # The simulated period and calendar (the model time step is model.yaml numerics.step_seconds).

  # First model time, ISO date-time (e.g. 2007-05-01T00:00).
  # Fortran: start_ymd, start_tod; REQUIRED.
  start: 2007-05-01T00:00

  # End of the run, ISO date-time. Give exactly one of end, days and steps.
  # Fortran: stop_option, stop_n; default: null.
  end: null

  # Length of the run in days (or end, or steps).
  # default: null.
  days: 31.0

  # Length of the run in model steps (or end, or days).
  # default: null.
  steps: null

  # Model calendar, as CTSM's GREGORIAN / NO_LEAP: dates, solar geometry, run length and output
  # records follow it. noleap only for grid runs (tower forcing is a real time series).
  # choices: gregorian | noleap; default: gregorian.
  calendar: gregorian

forcing:
  # Meteorology and prescribed land data.

  # Tower meteorology.
  meteorology:
    # Tower forcing netCDF file(s); may be split in time with {year} and {month} (e.g.
    # {year}-{month:02d}.nc) and shared by towers with {tower}.
    # Fortran: fin_tower; REQUIRED.
    files: [../../data/input_files/tower-forcing/CHATS7/2007-05.nc]

    # Time between the records of the forcing files (s). The model step (model.yaml
    # numerics.step_seconds) must divide it; shorter steps interpolate the forcing.
    # default: 1800.
    interval_seconds: 1800

    # Forcing within a model step's sub-steps: three-point interpolation of the previous, current
    # and next records (CLM-ml v2), or the step's record unchanged.
    # choices: none | three_point; Fortran: met_type 3/0; default: three_point.
    interpolation: three_point

    # Shortwave radiation from the data interval to a shorter model step: following the cosine of
    # the solar zenith angle (conserves interval means), linear, or held.
    # choices: coszen | linear | constant; default: coszen.
    shortwave: coszen

    # Precipitation from the data interval to a shorter model step: held (conserves totals) or
    # linear.
    # choices: constant | linear; default: constant.
    precipitation: constant

  # The CLM history file.
  clm_history:
    # CLM history file (netCDF, one patch, at the forcing interval) with ELAI, ESAI, H2OSOI and
    # TSOI: the initial soil temperature, and LAI, SAI and soil water when their source is
    # clm_history.
    # Fortran: fin_clm; REQUIRED.
    file: ../../data/input_files/clm5_0/CHATS7/CHATS_A15.clm2.h1.2007-04-01-00000_22Jul25.nc

    # Date-time of the history file's first record.
    # Fortran: clm_start_ymd, clm_start_tod; REQUIRED.
    start: 2007-04-01T00:00

  # Leaf and stem area index.
  vegetation:
    # Where the values come from: the CLM history file, or files.
    # choices: clm_history | file; default: clm_history.
    source: clm_history

    # With source file: the netCDF file(s).
    # default: [].
    files: []

    # Between the middles of the files' intervals.
    # choices: linear; default: linear.
    interpolation: linear

  # Volumetric soil water.
  soil_water:
    # Where the values come from: the CLM history file, or files.
    # choices: clm_history | file; default: clm_history.
    source: clm_history

    # With source file: the netCDF file(s).
    # default: [].
    files: []

    # Between the middles of the files' intervals.
    # choices: linear; default: linear.
    interpolation: linear

    # Soil water adjusted to observations by factors (CHATS); null: none.
    adjustment:
      # Adjustment factors per CLM history record (netCDF, FACTOR).
      # Fortran: fin_soil_adjust; REQUIRED.
      file: ../../data/input_files/clm5_0/CHATS7/CHATS_soil_moisture_correction_29Jul25.nc

      # Number of soil levels, from the top, multiplied by the factor.
      # Fortran: nlev_soil_adjust; default: 3.
      levels: 3

initial_conditions:
  # The state before the first step.

  # clm_history: canopy air and leaves from the first forcing record, soil temperature from the
  # CLM history (towers) or the monthly soil history (grid); restart: a restart file of an earlier
  # run.
  # choices: clm_history | restart; default: clm_history.
  source: clm_history

  # With source restart: the restart file.
  # default: null.
  restart_file: null

output:
  # What the run writes.

  # Output directory.
  # default: output.
  directory: output

  # The output streams.
  streams:
  # Name of the stream (in its file names).
  # REQUIRED.
  - name: halfhourly

    # How often a record is written.
    # choices: step | hourly | daily | monthly | yearly; default: step.
    frequency: step

    # What a record holds for its interval.
    # choices: mean | instantaneous | min | max; default: mean.
    statistic: mean

    # Variables: all, or names from clm_ml.outputs.VARIABLES (e.g. latent_heat_flux, gpp).
    # default: [all].
    variables: [all]

    # Patch values, area-weighted gridcell sums, or both.
    # default: [patch, gridcell].
    level: [patch]

    # One file per run, year or month.
    # choices: run | year | month; default: run.
    file_per: run

  # Also write the six Fortran-format .out files (one patch; for the comparison with Fortran CLM-
  # ml v2 only).
  # default: false.
  legacy_ascii: true

execution:
  # How the run is divided into compiled chunks, where it runs and how often it saves restarts.
  # None of this changes the results.

  # Compiled chunk length: 'N days' (one compiled program; a short last chunk is padded) or '1
  # month' (calendar months). Sets how much forcing is in memory and how often the checks run.
  # default: 10 days.
  chunk: 10 days

  # Restart files every 'N months' or 'N years'; null: at the end of the run only.
  # default: null.
  restart_every: null

  # Number of devices (e.g. 4 GPUs on a Derecho node) the patches are spread over.
  # default: 1.
  devices: 1
