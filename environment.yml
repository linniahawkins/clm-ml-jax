name: clm-ml-jax
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # JAX 0.10.2 with the CUDA 12 plugin (decision 105, O73): the regression reference is
      # recorded with this version. On nodes without a GPU (e.g. derecho1, CPU compute nodes)
      # set JAX_PLATFORMS=cpu, or the plugin prints a CUDA_ERROR_NO_DEVICE traceback at import
      # (harmless: JAX falls back to the CPU).
      - "jax[cuda12]==0.10.2"
      - numpy>=1.20.0
      - matplotlib>=3.7.0
      - f90nml>=1.4.0
      - netCDF4             # needed for reading tower/CLM input files
      - pyyaml>=6.0         # YAML configuration files
      - xarray              # labelled output
      - scipy
      - pytest>=7.0.0
      - pytest-cov>=4.0.0
      - black>=23.0.0       # lint (CI): black --check --line-length 100
      - ruff>=0.1.0
