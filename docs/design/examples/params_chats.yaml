# Parameters for the CHATS walnut orchard: replaces pftcon_val = 1.
# Starts from the shipped CLM5 defaults and overrides only what differs.
# Values per PFT; every site looks up its own PFT's values.

extends: clm5_defaults

pft:
  broadleaf_deciduous_temperate_tree:
    vcmax25: 125.0             # umol m-2 s-1      Rosati et al. (2006)       default 57.7
    plant_conductance: 7.0     # mmol m-2 s-1 MPa-1  Tyree et al. (1993)     default 4.0
    iota: 375.0                # umol CO2 mol-1 H2O  Rosati et al. (2006)    default 750.0
    root_resistivity: 14.0     # MPa s g mmol-1    Tyree et al. (1994)        default 25.0
    psi50_gs: -1.60            # MPa               SPA-walnut                 default -2.3
    shape_gs: 40.0             # -                 SPA-walnut                 default 40.0
    leaf_angle_index: 0.53     # -                 walnut                     default 0.25
    leaf_reflectance: [0.06, 0.42]    # [vis, nir]  Majasalmi & Bright (2019)  default [0.10, 0.45]
    leaf_transmittance: [0.04, 0.43]  # [vis, nir]  Majasalmi & Bright (2019)  default [0.05, 0.25]
    stem_reflectance: [0.21, 0.49]    # [vis, nir]  deciduous bark             default [0.16, 0.39]
