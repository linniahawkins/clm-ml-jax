# Experiment file: replaces offline_executable/nl.CHATS7.1day
# Run with:  clm-ml run run_chats7_1day.yaml
# Paths are relative to this file. This is the target form (plan v4, §4.1); the Phase 1
# implementation reads an earlier, simpler form until Phase 4.

model: model.yaml
params: params_chats.yaml

time:
  start: 2007-05-01T00:00          # was start_ymd / start_tod
  end: 2007-05-02T00:00            # was stop_option='ndays', stop_n=1  (alternatively: days: 1)

domain:
  type: towers                     # towers | grid (grid reserved for later)
  towers: [CHATS7]                 # names from the built-in registry and/or towers_file
  towers_file: null                # optional: your own towers.yaml (see towers_example.yaml)
  min_patch_weight: 0.0            # drop patches covering less than this fraction of a gridcell

execution:
  chunk: 1 month                   # forcing read and output written per chunk (sets memory use)
  restart_every: null              # one restart at the end of the run

forcing:
  # {tower} is replaced by each tower's name, so one entry serves many towers.
  # The CHATS7 data are already at the model step (30 min), so no time interpolation
  # beyond CLM-ml v2's three-point rule is applied.
  meteorology:
    files: ../../../src/input_files/tower-forcing/{tower}/{year}-{month:02d}.nc   # was fin_tower
    interpolation: three_point     # within each step's sub-steps: none | three_point (met_type 0 / 3)
    shortwave: coszen              # only if the data interval exceeds the model step
    precipitation: constant        # (coszen | linear | constant; constant | linear)
  clm_history:                     # initial conditions; LAI, SAI, soil water with source clm_history
    file: ../../../src/input_files/clm5_0/{tower}/CHATS_A15.clm2.h1.2007-04-01-00000_22Jul25.nc
    start: 2007-04-01T00:00        # was clm_start_ymd / clm_start_tod
  vegetation:
    source: clm_history            # LAI/SAI from the CLM history file (file: user files)
  soil_water:
    source: clm_history
    adjustment:                    # CHATS: soil water adjusted to observations
      file: ../../../src/input_files/clm5_0/{tower}/CHATS_soil_moisture_correction_29Jul25.nc
      levels: 3                    # was nlev_soil_adjust

initial_conditions:
  source: clm_history              # clm_history | restart
  restart_file: null

output:                            # independent of forcing interval, model step and chunk
  directory: ../../../src/output_files/   # was dirout
  streams:
    - name: halfhourly
      frequency: step              # step | hourly | daily | monthly | yearly
      statistic: mean              # mean | instantaneous | min | max
      variables: all               # all, or a list such as [latent_heat_flux, gpp]
      level: [patch, gridcell]
      file_per: run                # run | year | month
