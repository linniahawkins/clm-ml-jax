# Global runs (decision 28, input decision 7): 10 layers within and 10 above every canopy.
canopy_layers:
  n_layers_within: 10
  n_layers_above: 10
  max_layers: 20
numerics:
  on_patch_error: exclude          # decision 25: a failing patch is left out, not the run
  max_failed_patch_fraction: 0.05
  # CLM-ml's diagnostic canopy latent heat uses the air temperature's latent heat (vaporization
  # or sublimation), the leaves and soil their own: below freezing this check fails by ~0.1-2
  # W m-2 although the fluxes are unchanged (open issue 12 in docs/design/global_input.md).
  # Reported every chunk, but does not exclude patches.
  ignore_checks: ["CanopyFluxesDiagnostics 3"]
