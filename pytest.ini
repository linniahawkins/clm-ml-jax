[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config --verbose -ra --no-cov
filterwarnings = 
    error
    # Ignore specific external library warnings that we can't control
    ignore::DeprecationWarning:netCDF4
    # netCDF4/numpy binary-compatibility notice on import; harmless (numpy ABI is compatible)
    ignore:numpy.ndarray size changed:RuntimeWarning
    ignore::DeprecationWarning:xarray
    ignore::DeprecationWarning:numpy
    # Allow FutureWarnings from JAX (these are informational about upcoming changes)
    ignore::FutureWarning:jax
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    fortran_validation: tests that compare JAX output against Fortran golden data
    requires_rsl: test requires RSL psihat lookup tables (netCDF4)
    regression: end-to-end regression against committed reference output (~5 min)
    gradient: gradient tests (the gradient tier; run with tests/gradient_tier.py, see phase7_progress.md)